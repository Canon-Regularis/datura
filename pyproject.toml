[project]
name = "datura"
version = "0.1.0"
description = "Whale species classification from Watkins marine mammal recordings"
requires-python = ">=3.12,<3.15"
dependencies = [
    "numpy>=2.1,<3",
    "scipy>=1.14,<2",
    "pandas>=2.2,<4",
    "pyarrow>=17",
    "soundfile>=0.13,<1",
    "soxr>=0.5,<2",
    "librosa>=0.11,<1",
    "scikit-learn>=1.6,<2",
    "xgboost>=2.1,<4",
    "matplotlib>=3.9,<4",
    "pyyaml>=6.0,<7",
    "tqdm>=4.66,<5",
    "tabulate>=0.9,<1",
]

# torch is installed through exactly one of these. The wheels differ by gigabytes,
# so the choice is explicit and the lockfile records both resolutions:
#   uv sync --extra cuda    a machine with an NVIDIA GPU and driver 560 or newer
#   uv sync --extra cpu     CI, and anything without a GPU
#
# torchaudio supplies the pretrained encoder definition and nothing else. The floor is
# 2.11 because every release before it pins an exact torch, and 2.10 would drag torch
# back two minor versions to satisfy `torch==2.10.0`. It is used for model construction
# rather than for its kernels, so one build serves both extras.
[project.optional-dependencies]
cpu = ["torch>=2.5,<3", "torchaudio>=2.11,<3"]
cuda = ["torch>=2.5,<3", "torchaudio>=2.11,<3"]

[dependency-groups]
dev = [
    "pytest>=9.1.1,<10",
    "pytest-cov>=6.0",
    "ruff>=0.16,<0.17",
    "mypy>=1.14,<2",
    # PyYAML ships no inline types, and the config loader is the one place that reads YAML.
    "types-PyYAML>=6.0",
    "pre-commit>=4.0",
    "ipykernel>=6.29",
    "nbclient>=0.10",
    "nbformat>=5.10",
]

[tool.uv]
package = false
conflicts = [[{ extra = "cpu" }, { extra = "cuda" }]]

# librosa pulls in numba, and every numba release caps the numpy it will accept. Raising
# the numpy floor past that cap does not stop the resolve. uv walks back through numba
# releases until it reaches one old enough to declare no cap at all, which is numba 0.53.1
# from 2021, and that release ships no wheel for any interpreter this project runs on. Six
# jobs then spend their time compiling a source tree from 2021 and fall over in the build.
#
# The floor below is the first numba with a Python 3.12 wheel, so it is the oldest one that
# can run on the oldest interpreter in requires-python. Nothing older is selectable, and the
# conflict surfaces at `uv lock` as a sentence naming numpy and numba.
constraint-dependencies = ["numba>=0.59"]

# The same walk otherwise ends on a numba release candidate. Every version in the lock is a
# stable release, and a resolver that runs out of them should stop rather than reach for a
# prerelease of the compiler that librosa decodes audio through.
prerelease = "disallow"

[tool.uv.sources]
torch = [
    { index = "pytorch-cpu", extra = "cpu" },
    { index = "pytorch-cu126", extra = "cuda" },
]
# torchaudio has to come from the same index as torch, not from PyPI. Its Linux wheel
# ships a compiled extension linked against a specific libtorch, and the PyPI build is
# linked against the torch it was released beside rather than the one pinned here. That
# combination installs cleanly and then fails at import with an undefined symbol.
#
# It cost three CI jobs to find, because the Windows wheel carries no such extension:
# Windows passed, all three Linux jobs failed, and the two jobs that never import
# torchaudio passed on Linux as well.
torchaudio = [
    { index = "pytorch-cpu", extra = "cpu" },
    { index = "pytorch-cu126", extra = "cuda" },
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
# G and LOG keep logging lazy and correctly parameterised. T20 keeps print out of the
# library, PT keeps a failing assertion able to say which half failed, ERA stops
# commented out code accumulating, and SLF makes a test reaching past a public surface
# state why it had to.
select = [
    "E", "F", "I", "UP", "B", "SIM", "RUF", "G", "LOG",
    "W", "C4", "PERF", "FURB", "RET", "NPY", "PD", "ERA", "PIE", "T10", "T20", "A", "PT", "SLF",
]

# Deliberately not selected, each for a reason rather than to keep the count down:
#   D401    58 hits. The non-imperative docstring voice is the house style.
#   EM      143 hits, and TRY003 the same. Long inline prescriptive messages are the
#           convention here: an error says what to do next, at the point it is raised.
#   N818    nine exception names that read as sentences rather than as Error suffixes.
#   TC      83 hits. It would force TYPE_CHECKING blocks, which this codebase avoids
#           so that an annotation and the import behind it cannot disagree.
ignore = [
    # unstack with a fill value is what these three want. pivot_table aggregates, which
    # is a different operation that happens to produce the same shape here.
    "PD010",
    # `nunique() == 1` is the readable way to say a column is constant, and the frames
    # it is asked of are a few dozen rows.
    "PD101",
]

[tool.ruff.lint.per-file-ignores]
# The prediction command's output is print. Routing it through logging would put a
# level and a timestamp on the one thing a person ran the command to read.
"src/predict/__main__.py" = ["T201"]

# A notebook's print is its output, for the same reason. `display` shadows a builtin
# nobody uses and is IPython's own name for the function, so renaming it on import
# would make every cell read less like the notebooks it is copied from.
"experiments/*.ipynb" = ["T201", "A004"]

[tool.mypy]
files = ["src"]
python_version = "3.12"
# soundfile, soxr, librosa, xgboost and tqdm ship no stubs. Their absence is a fact
# about those packages rather than about this code, and treating it as an error would
# put a per-import silencer at the top of half the modules.
ignore_missing_imports = true
warn_redundant_casts = true
warn_unused_ignores = true
# Not strict yet, and the gap is annotations rather than unsoundness: `disallow_untyped_defs`
# is the next step and `config/`, `results.py`, `uncertainty.py` and `errors.py` already
# clear it. `tests/` is excluded because 293 of its 350 functions carry no annotations.
strict = false

[tool.pytest.ini_options]
testpaths = ["tests"]
# -ra so a skip says why. 36 of these skip on a missing committed artifact, and a fresh
# clone used to report them as passes with nothing on screen to say otherwise.
addopts = "-q -ra --strict-markers -m 'not slow'"
markers = [
    "slow: exercises the whole pipeline on synthetic audio, takes a minute or two",
]
# A warning the project can act on is a failure. The exceptions are libraries announcing
# their own future or tidying up after themselves, neither of which this project can fix.
#
# The last three are one library on one platform. Executing a notebook starts a kernel,
# and on Windows zmq cannot use the default event loop, so it says so and works around it
# through tornado, then leaves its sockets to the garbage collector. All three are matched
# by message rather than by class: a bare RuntimeWarning would also swallow numpy telling
# us about a divide by zero, and a bare ResourceWarning would swallow a file this project
# left open. None of them fire on Linux, where CI runs the notebooks.
filterwarnings = [
    "error",
    "ignore::DeprecationWarning",
    "ignore::PendingDeprecationWarning",
    "ignore:Proactor event loop does not implement add_reader:RuntimeWarning",
    "ignore:Unclosed socket:ResourceWarning",
    "ignore:.*Unclosed socket.*:pytest.PytestUnraisableExceptionWarning",
]
