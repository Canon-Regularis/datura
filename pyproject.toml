[project]
name = "datura"
version = "0.1.0"
description = "Whale species classification from Watkins marine mammal recordings"
requires-python = ">=3.12,<3.15"
dependencies = [
    "numpy>=2.1",
    "scipy>=1.14",
    "pandas>=2.2",
    "pyarrow>=17",
    "soundfile>=0.13",
    "soxr>=0.5",
    "librosa>=0.11",
    "scikit-learn>=1.6",
    "xgboost>=2.1",
    "torch>=2.5",
    "matplotlib>=3.9",
    "pyyaml>=6.0",
    "tqdm>=4.66",
    "tabulate>=0.9",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.8",
    "ipykernel>=6.29",
    "jupyter>=1.1",
]

[tool.uv]
package = false

# The default PyPI wheel for Windows is CPU only. Driver 560 supports CUDA 12.6,
# and the laptop GPU cuts CNN training time by several times over 12 CPU threads.
[tool.uv.sources]
torch = { index = "pytorch-cu126" }

[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning"]
