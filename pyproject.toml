[project]
name = "datura"
version = "0.1.0"
description = "Whale species classification from Watkins marine mammal recordings"
requires-python = ">=3.12,<3.15"
dependencies = [
    "numpy>=2.5.1,<3",
    "scipy>=1.14,<2",
    "pandas>=2.2,<4",
    "pyarrow>=17",
    "soundfile>=0.13,<1",
    "soxr>=0.5,<2",
    "librosa>=0.11,<1",
    "scikit-learn>=1.6,<2",
    "xgboost>=2.1,<4",
    "matplotlib>=3.9,<4",
    "pyyaml>=6.0,<7",
    "tqdm>=4.66,<5",
    "tabulate>=0.9,<1",
]

# torch is installed through exactly one of these. The wheels differ by gigabytes,
# so the choice is explicit and the lockfile records both resolutions:
#   uv sync --extra cuda    a machine with an NVIDIA GPU and driver 560 or newer
#   uv sync --extra cpu     CI, and anything without a GPU
[project.optional-dependencies]
cpu = ["torch>=2.5,<3"]
cuda = ["torch>=2.5,<3"]

[dependency-groups]
dev = [
    "pytest>=9.1.1,<10",
    "pytest-cov>=6.0",
    "ruff>=0.16,<0.17",
    "pre-commit>=4.0",
    "ipykernel>=6.29",
    "nbclient>=0.10",
    "nbformat>=5.10",
]

[tool.uv]
package = false
conflicts = [[{ extra = "cpu" }, { extra = "cuda" }]]

[tool.uv.sources]
torch = [
    { index = "pytorch-cpu", extra = "cpu" },
    { index = "pytorch-cu126", extra = "cuda" },
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
# G and LOG keep logging lazy and correctly parameterised.
select = ["E", "F", "I", "UP", "B", "SIM", "RUF", "G", "LOG"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
markers = [
    "slow: exercises the whole pipeline on synthetic audio, takes a minute or two",
]
filterwarnings = ["ignore::DeprecationWarning"]
