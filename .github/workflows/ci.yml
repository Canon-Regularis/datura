name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Pinned to the uv that wrote uv.lock, and it has to be at least that version.
  # The lock is written in a versioned format, and a uv too old to read the current
  # revision does not fail: it discards the lock and resolves the dependency tree
  # from scratch. That is how this workflow came to build a numba from 2021 against
  # Python 3.14 and fall over, when the numba in the lock ships a wheel for exactly
  # that interpreter.
  #
  # Bump this by hand after `uv lock` writes a newer revision; `uv --version` says
  # what wrote the one in the repo. Dependabot does not maintain it, because it
  # updates action references and dependencies rather than workflow variables.
  #
  # Every install is `uv sync --locked`, which refuses to run at all unless the lock
  # is present and current. UV_FROZEN would also stop the lock being rewritten, but
  # it tolerates a stale one silently, and silence is what cost a day here.
  UV_VERSION: "0.12.0"

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
          cache-dependency-glob: uv.lock
          python-version: "3.14"

      - name: Check the lockfile matches pyproject
        run: uv lock --check

      - run: uv sync --locked --extra cpu
      - run: uv run ruff check --output-format=github .
      - run: uv run ruff format --check .

  test:
    name: test ${{ matrix.python }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, python: "3.12" }
          - { os: ubuntu-latest, python: "3.13" }
          - { os: ubuntu-latest, python: "3.14" }
          # Development happens on Windows and this codebase does a lot of path
          # handling, so one Windows job guards against separator regressions.
          - { os: windows-latest, python: "3.14" }
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
          cache-dependency-glob: uv.lock
          python-version: ${{ matrix.python }}

      - run: uv sync --locked --extra cpu

      - name: Unit and pipeline tests
        run: uv run pytest --cov=src --cov-report=term-missing --cov-report=xml

      - name: Upload coverage
        if: matrix.os == 'ubuntu-latest' && matrix.python == '3.14'
        uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: coverage.xml
          retention-days: 14

  reproduce:
    name: reproduce the report from committed results
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
          cache-dependency-glob: uv.lock
          python-version: "3.14"

      - run: uv sync --locked --extra cpu

      # The manifests and per-clip predictions are committed, so every report rebuilds
      # without the 6.7 GB archive. If a table stops regenerating, or regenerates
      # differently, this job is where it surfaces.
      - name: Rebuild every report
        run: |
          uv run python -m src.evaluate.report --config configs/base.yaml
          uv run python -m src.evaluate.report --config configs/base_5k.yaml
          uv run python -m src.evaluate.report --config configs/wide.yaml

      # Figures and provenance are excluded. Matplotlib output is not byte-stable
      # across versions, and provenance carries a timestamp by design.
      #
      # The tables are byte-stable because report.py rounds them before writing.
      # Full float64 repr is not reproducible across platforms: scipy reaches the
      # t distribution through the platform's libm, and this job caught Windows
      # and Linux disagreeing in the seventeenth significant figure of a p value.
      - name: Fail if a rebuilt table drifted from the committed one
        run: |
          git diff --stat -- data/metadata/report
          git diff --exit-code -- data/metadata/report ':!*.png' ':!*provenance.json'

      - name: Upload regenerated report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: report
          path: data/metadata/report
          retention-days: 14
