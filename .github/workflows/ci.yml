name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # The default torch wheel drags in the whole CUDA stack. No runner here has a GPU,
  # so every job installs the CPU build and saves several gigabytes per run.
  UV_FROZEN: "1"

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Check the lockfile matches pyproject
        run: uv lock --check

      - run: uv sync --extra cpu
      - run: uv run ruff check --output-format=github .
      - run: uv run ruff format --check .

  test:
    name: test ${{ matrix.python }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, python: "3.12" }
          - { os: ubuntu-latest, python: "3.13" }
          - { os: ubuntu-latest, python: "3.14" }
          # Development happens on Windows and this codebase does a lot of path
          # handling, so one Windows job guards against separator regressions.
          - { os: windows-latest, python: "3.14" }
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock
          python-version: ${{ matrix.python }}

      - run: uv sync --extra cpu

      - name: Unit and pipeline tests
        run: uv run pytest --cov=src --cov-report=term-missing --cov-report=xml

      - name: Upload coverage
        if: matrix.os == 'ubuntu-latest' && matrix.python == '3.14'
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage.xml
          retention-days: 14

  reproduce:
    name: reproduce the report from committed results
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - run: uv sync --extra cpu

      # The manifests and per-clip predictions are committed, so both reports rebuild
      # without the 6.7 GB archive. If a table stops regenerating, or regenerates
      # differently, this job is where it surfaces.
      - name: Rebuild both reports
        run: |
          uv run python -m src.evaluate.report --config configs/base.yaml
          uv run python -m src.evaluate.report --config configs/base_5k.yaml

      # Figures and provenance are excluded. Matplotlib output is not byte-stable
      # across versions, and provenance carries a timestamp by design.
      - name: Fail if a rebuilt table drifted from the committed one
        run: |
          git diff --stat -- data/metadata/report
          git diff --exit-code -- data/metadata/report ':!*.png' ':!*provenance.json'

      - name: Upload regenerated report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: report
          path: data/metadata/report
          retention-days: 14
