# Sensitivity variant. Drops the common band to 0 to 2560 Hz, which keeps every
# humpback tape including the three recorded at 5120 Hz. Compare against base.yaml
# to see whether conclusions depend on the band choice.
name: base_5k

# What this variant has actually been run with. The full capacity network and the
# call type tasks were only ever posed at 10 kHz, and a pipeline run that trained
# them here would add sections to this configuration's report that are not in the
# committed one.
pipeline:
  models: [xgboost, metadata, logbook, cnn_small]
  call_types: []

dataset:
  archive_url: https://archive.org/download/watkins-marine-mammal-sound-database-full-cuts/Watkins_Marine_Mammal_Sound_Database_full_cuts.zip
  zip_name: Watkins_Marine_Mammal_Sound_Database_full_cuts.zip
  archive_sha256: 6631c14cf91269ee5b97ef0f3e9d838302af194901108729cfba26c1bc044f3e
  archive_root: Watkins_Marine_Mammal_Sound_Database
  species:
    - HumpbackWhale
    - SpermWhale
    - KillerWhale

audio:
  target_sample_rate: 5120
  min_native_sample_rate: 5120
  window_seconds: 2.0
  hop_seconds: 1.0
  min_clip_seconds: 0.5
  pad_mode: reflect
  max_windows_per_clip: 16

spectrogram:
  n_fft: 512
  hop_length: 64
  n_mels: 64
  fmin: 50
  fmax: 2500

split:
  n_folds: 5
  seed: 1234
  tape_id_length: 5
  # Which manifest column folds are grouped over. Watkins fills it from the
  # tape; a collection of continuous recordings would fill it from site and year.
  group_column: tape_id

paths:
  raw: data/raw
  metadata: data/metadata
  processed: data/processed
  reports: data/metadata/report
