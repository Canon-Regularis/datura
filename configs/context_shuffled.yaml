# The coarseness control for context_10k, and the only reason it exists.
#
# Holding out a recording context costs XGBoost 0.431 macro-F1 against tape folds, from
# 0.752 to 0.321. Two explanations fit that. The model was leaning on something the
# place carries, or five folds over 24 groups is simply a coarser and far more lopsided
# split than five folds over 134 tapes. One of those is a finding and the other is
# arithmetic.
#
# This groups on pseudo contexts built to match the real ones exactly: same number of
# groups, same species mix, same tape count per group, tapes dealt at random within a
# species. Every structural property of the split is preserved and the place is
# destroyed. If the score falls here too, the drop is coarseness. If it holds up, the
# place is doing real work.
#
# It falls to 0.556, so coarseness accounts for 0.197 of the 0.431 and the remaining
# 0.234 is the place. Both parts are real and neither explains the drop alone.
extends: base.yaml
name: context_shuffled_10k

dataset:
  # The same data as base_10k, so its manifest, audit tables and feature caches are
  # read rather than rebuilt. Only the fold rule differs, and that is not a property
  # of the corpus.
  corpus: base_10k

split:
  # Pseudo contexts, dealt at random inside each species to match the real ones group
  # for group and tape for tape. Nothing about a place survives into this column.
  group_column: place_shuffled

# Trees, controls and the probe. The two from scratch networks are left out: this
# configuration exists to measure a gap against base_10k, and the models that carry
# fifty splits in both are the ones that can measure it.
pipeline:
  models: [xgboost, xgboost_centred, metadata, logbook, probe]
  call_types: []
