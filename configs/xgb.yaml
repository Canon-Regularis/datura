model:
  n_estimators: 800
  max_depth: 6
  learning_rate: 0.05
  subsample: 0.8
  colsample_bytree: 0.8
  min_child_weight: 2.0
  reg_lambda: 1.0
  early_stopping_rounds: 60
  tree_method: hist
  # A fixed thread count rather than -1. XGBoost sums its histograms in whatever
  # order the threads finish, so the fitted model is not thread count invariant, and
  # -1 would make a committed score depend on how many cores the machine that wrote
  # it happened to have. Four is available on the CI runners and on a laptop.
  n_jobs: 4
  random_state: 1234
