# The control model. It is given native sample rate, recording year, clip duration
# and file size; it is given no audio at all.
#
# Deliberately small. Its job is to measure a floor, so extra capacity would only
# make that floor harder to interpret.
model:
  n_estimators: 400
  max_depth: 4
  learning_rate: 0.05
  subsample: 0.9
  colsample_bytree: 1.0
  reg_lambda: 1.0
  early_stopping_rounds: 40
  tree_method: hist
  n_jobs: -1
