# The control model. It is given native sample rate, recording year, clip duration
# and file size; it is given no audio at all.
#
# Deliberately small. Its job is to measure a floor, so extra capacity would only
# make that floor harder to interpret.
model:
  n_estimators: 400
  max_depth: 4
  learning_rate: 0.05
  subsample: 0.9
  colsample_bytree: 1.0
  reg_lambda: 1.0
  early_stopping_rounds: 40
  tree_method: hist
  # A fixed thread count rather than -1. XGBoost sums its histograms in whatever
  # order the threads finish, so the fitted model is not thread count invariant, and
  # -1 would make a committed score depend on how many cores the machine that wrote
  # it happened to have. Four is available on the CI runners and on a laptop.
  n_jobs: 4
